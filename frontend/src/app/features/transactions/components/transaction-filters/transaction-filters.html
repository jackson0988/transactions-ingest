<div class="card shadow-sm">
  <div class="card-body">
    <div class="row g-2 align-items-end">
      <div class="col-12 col-md-4">
        <label for="search" class="form-label small text-body-secondary mb-1">Search</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input
            id="search"
            type="search"
            class="form-control"
            placeholder="Txn id, product, location..."
            [value]="value().search"
            (input)="update({ search: $any($event.target).value })"
          />
        </div>
      </div>

      <div class="col-6 col-md-3">
        <label for="source" class="form-label small text-body-secondary mb-1">Source system</label>
        <select id="source" class="form-select" [value]="value().sourceSystem" (change)="update({ sourceSystem: $any($event.target).value })">
          <option value="">All</option>
          @for (s of sourceSystems; track s) {
            <option [value]="s">{{ s }}</option>
          }
        </select>
      </div>

      <div class="col-6 col-md-3">
        <label for="status" class="form-label small text-body-secondary mb-1">Status</label>
        <select id="status" class="form-select" [value]="value().status" (change)="update({ status: $any($event.target).value })">
          <option value="">All</option>
          @for (s of statuses; track s) {
            <option [value]="s">{{ s }}</option>
          }
        </select>
      </div>

      <div class="col-12 col-md-2 d-grid">
        <button type="button" class="btn btn-link text-decoration-none" (click)="clear()">Clear filters</button>
      </div>
    </div>
  </div>
</div>
