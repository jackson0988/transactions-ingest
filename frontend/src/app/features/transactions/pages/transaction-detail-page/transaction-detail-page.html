<a routerLink="/transactions" class="btn btn-link px-0 text-decoration-none tw:mb-3">
  <i class="bi bi-arrow-left"></i> Back to transactions
</a>

@if (loading()) {
  <div class="tw:flex tw:justify-center tw:py-16">
    <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
  </div>
} @else if (notFound()) {
  <div class="alert alert-warning">Transaction could not be loaded. It may not exist anymore.</div>
} @else if (transaction(); as tx) {
  <div class="row g-4">
    <div class="col-12 col-lg-5">
      <app-transaction-summary [transaction]="tx" />
    </div>
    <div class="col-12 col-lg-7">
      <app-audit-history [entries]="audit()" />
    </div>
  </div>
}
